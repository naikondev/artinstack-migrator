<!-- Minimal Fluid Engine post body shape (meiwensee softgoodstudio): website-component precedes concrete type. -->
<div class="sqs-layout sqs-grid-12 columns-12" data-layout-label="Post Body" data-type="item">
  <div class="row sqs-row">
    <div class="col sqs-col-12 span-12">
      <div class="sqs-block website-component-block sqs-block-website-component sqs-block-spacer spacer-block">
        <div class="sqs-block-content">&nbsp;</div>
      </div>
      <div class="sqs-block website-component-block sqs-block-website-component sqs-block-html html-block" id="block-post-intro">
        <div class="sqs-block-content">
          <div class="sqs-html-content">
            <p style="white-space:pre-wrap;">I stumbled upon Soft Good Studio one day deep in an Instagram rabbit hole.</p>
          </div>
        </div>
      </div>
      <div class="sqs-block image-block sqs-block-image" id="block-post-hero">
        <div class="sqs-block-content">
          <img data-src="https://images.squarespace-cdn.com/content/v1/softgood-hero.jpg" alt="Studio" />
        </div>
      </div>
      <div class="sqs-block website-component-block sqs-block-website-component sqs-block-html html-block" id="block-post-q1">
        <div class="sqs-block-content">
          <h4 style="white-space:pre-wrap;">Hi Emilie! How are you today?</h4>
        </div>
      </div>
      <div class="sqs-block website-component-block sqs-block-website-component sqs-block-quote quote-block" id="block-post-quote">
        <div class="sqs-block-content">
          <blockquote>
            <span>I’m quickly learning that I can’t please everyone.</span>
          </blockquote>
        </div>
      </div>
    </div>
  </div>
</div>
